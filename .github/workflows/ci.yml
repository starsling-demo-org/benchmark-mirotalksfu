name: CI/CD

on:
  # bench-only: run on each PR into starsling/develop; no push trigger.
  pull_request:
    branches: [starsling/develop]

jobs:
  test:
    runs-on: starsling-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - run: npm ci
      - run: cp app/src/config.template.js app/src/config.js
      - run: npm test

  build:
    runs-on: starsling-ubuntu-24.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: ${{ false }} # bench-only: no registry secrets in the benchmark repo
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false # bench-only: never publish mirotalk/sfu
          tags: mirotalk/sfu:latest
          cache-from: type=gha,scope=mirotalksfu
          cache-to: type=gha,mode=max,scope=mirotalksfu
